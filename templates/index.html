<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HireFlow - Job Recruitment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">HireFlow Portal</a>
            <div>
                <a href="/" class="btn btn-light btn-sm me-2">Browse Jobs</a>
                <a href="/post-job" class="btn btn-warning btn-sm me-2">+ Post a Job</a>
                <a href="/applications" class="btn btn-outline-light btn-sm">HR Dashboard (Applications)</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Available Job Openings</h2>
        <div class="row">
            {% for job in jobs %}
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-primary">{{ job['title'] }}</h5>
                        <h6 class="card-subtitle mb-2 text-muted">{{ job['company'] }} • {{ job['location'] }}</h6>
                        <span class="badge bg-success mb-2">{{ job['salary'] }}</span>
                        <p class="card-text">{{ job['description'] }}</p>
                    </div>
                    <div class="card-footer bg-white border-top-0">
                        <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#applyModal{{ job['id'] }}">
                            Apply Now
                        </button>
                    </div>
                </div>
            </div>

            <!-- Apply Modal -->
            <div class="modal fade" id="applyModal{{ job['id'] }}" tabindex="-1">
                <div class="modal-dialog">
                    <form action="/apply/{{ job['id'] }}" method="POST" class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Apply for {{ job['title'] }}</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Key Skills / Portfolio Link</label>
                                <textarea name="skills" class="form-control" rows="2" required></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-success">Submit Application</button>
                        </div>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
